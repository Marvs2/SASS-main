{% extends "student/layout.html" %}
{% block content %}
<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form-container h3 {
        margin-bottom: 20px;
        text-align: center;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
    }
    .form-group label {
        margin-bottom: 5px;
        font-weight: bold;
    }
    .form-group input,
    .form-group textarea {
        padding: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        background-color: #f9f9f9;
    }
    .form-group .form-control-readonly {
        background-color: #f1f1f1;
    }
    .btn-container {
        display: flex;
        justify-content: flex-end;
    }
    .btn {
        padding: 10px 20px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    .btn-secondary {
        background-color: #6c757d;
    }
    .btn + .btn {
        margin-left: 10px;
    }
</style>

<div class="form-container">
    <h3>Review Overload Request</h3>
    
    {% for overload in overloadlist %}
        <div class="form-group">
            <label for="studentNumber">Student Number:</label>
            <input type="text" id="studentNumber" class="form-control form-control-readonly" value="{{ overload.StudentNumber }}" readonly>
        </div>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" class="form-control form-control-readonly" value="{{ overload.Name }}" readonly>
        </div>
        <div class="form-group">
            <label for="programCourse">Program Course:</label>
            <input type="text" id="programCourse" class="form-control form-control-readonly" value="{{ overload.ProgramCourse }}" readonly>
        </div>
        <div class="form-group">
            <label for="semester">Semester:</label>
            <input type="text" id="semester" class="form-control form-control-readonly" value="{{ overload.Semester }}" readonly>
        </div>
        <div class="form-group">
            <label for="subjectsToAdd">Subjects to Add:</label>
            <input type="text" id="subjectsToAdd" class="form-control form-control-readonly" value="{{ overload.SubjectsToAdd }}" readonly>
        </div>
        <div class="form-group">
            <label for="justification">Justification:</label>
            <textarea id="justification" class="form-control form-control-readonly" rows="4" readonly>{{ overload.Justification }}</textarea>
        </div>
    {% endfor %}
    
    <div class="btn-container">
        <button class="btn btn-secondary" onclick="window.history.back();">Back</button>
    </div>
</div>
{% endblock content %}
